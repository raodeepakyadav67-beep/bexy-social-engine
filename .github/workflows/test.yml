# सबसे पहले आपकी API Key के लिए उपलब्ध सही मॉडल का नाम प्राप्त करना
          MODEL=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}" | jq -r '.models[] | select(.supportedGenerationMethods[] | contains("generateContent")) | .name' | grep -E 'flash|pro' | head -n 1)

          if [ -z "$MODEL" ]; then
            MODEL="models/gemini-1.5-flash-latest"
          fi

          echo "Using active model: $MODEL"

          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/${MODEL}:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          CANDIDATE=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          if [ -n "$CANDIDATE" ]; then
            POST_TEXT=$(echo "$CANDIDATE" | tr -d '*#"')
            echo "✅ Successfully generated!"
          else
            echo "❌ Gemini generation error: $RESPONSE"
            exit 1
          fi

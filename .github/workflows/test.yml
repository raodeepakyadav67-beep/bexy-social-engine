name: Auto Clinical Post to Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  post-clinical-pearl:
    runs-on: ubuntu-latest
    steps:
      - name: Generate AI Content and Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          PROMPT="Write a high-yield ICU Clinical Pearl for critical care nurses. Topic ideas: Arterial line dampening, Noradrenaline vs Vasopressin titration, ABG interpretation, or ventilator weaning pearls. Include bedside pearls with bullet points, emojis, and hashtags #ICUNursing #CriticalCare #Bexyhub. Keep it under 100 words."

          JSON_PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')

          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          POST_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$POST_TEXT" ]; then
            echo "Gemini API Error: $RESPONSE"
            exit 1
          fi

          echo "AI Content generated successfully!"

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHANNEL_ID" \
            --data-urlencode "text=$POST_TEXT"

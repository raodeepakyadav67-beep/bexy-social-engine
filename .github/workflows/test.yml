name: Auto Clinical Post to Telegram & LinkedIn

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # रोज़ाना सुबह 06:30 AM IST

jobs:
  post-clinical-pearl:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Natural Clinical Content and Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
         # 1. रैंडम टॉपिक चुनना ताकि हर बार अलग पोस्ट बने
          TOPICS=(
            "Arterial Line Damping and Flush Test Pitfalls in ICU"
            "Noradrenaline vs Vasopressin Titration in Refractory Septic Shock"
            "Post-CABG Sudden Mediastinal Drain Cessation and Cardiac Tamponade"
            "Recognizing Patient-Ventilator Asynchrony: Double Triggering & Flow Starvation"
            "Neuro ICU: Cerebral Perfusion Pressure (CPP) vs ICP Spike Management"
            "Electrolyte Emergencies: Rapid Potassium Correction and Cardiac Arrhythmias"
            "Post-PCI Radial Artery Hematoma and Bedside Compartment Syndrome Watch"
            "Targeted Temperature Management (TTM) Post-Cardiac Arrest Pearls"
            "High PEEP Hazards: Right Ventricular Strain and Hemodynamic Collapse"
            "Bedside CVP Interpretation: Volume Responsiveness vs Fluid Overload"
          )
          RANDOM_TOPIC=${TOPICS[$RANDOM % ${#TOPICS[@]}]}

          PROMPT="Act as Deepak Kumar, an MSc Nursing Officer and Intensive Care Specialist (CTVS, MICU, Neuro ICU).
            Write an ultra-realistic, practical bedside clinical pearl on: '$RANDOM_TOPIC'.
            Focus strictly on practical monitor reality, what the monitors show, exact bedside drug titration, and what textbooks miss.
            Keep it punchy, authoritative, and direct for Telegram and LinkedIn.
           Do not use generic definitions or AI fluff.
           Finish with a short 2-line practical bedside takeaway."

          # 2. Temperature 1.0 सेट किया गया ताकि कभी भी रिपीट न हो
          JSON_PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              contents: [{parts: [{text: $prompt}]}],
              generationConfig: {
                temperature: 1.0,
                topP: 0.95
              }
            }')

          POST_TEXT=""
          MODELS=("gemini-3.6-flash" "gemini-3.5-flash-lite" "gemini-3.5-flash")
          for MODEL in "${MODELS[@]}"; do
            echo "Requesting content from $MODEL..."
            RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD")

            CANDIDATE=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
            if [ -n "$CANDIDATE" ]; then
              # किसी भी बचे हुए एस्टरिस्क (*) को पूरी तरह साफ़ करना
              POST_TEXT=$(echo "$CANDIDATE" | tr -d '*')
              echo "✅ Successfully generated using $MODEL!"
              break
            else
              echo "⚠️ Model busy, switching to backup..."
              sleep 2
            fi
          done

          if [ -z "$POST_TEXT" ]; then
            echo "❌ Gemini generation error: $RESPONSE"
            exit 1
          fi

          echo "Preview of post:"
          echo "$POST_TEXT"

          # 2. Telegram पर साफ़ टेक्स्ट भेजना
          echo "📤 Posting clean text to Telegram..."
          TG_RES=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHANNEL_ID" \
            --data-urlencode "text=$POST_TEXT")
          echo "Telegram Response: $TG_RES"

          # 3. LinkedIn पर पोस्ट भेजना
          if [ -n "$LINKEDIN_TOKEN" ]; then
            echo "📤 Fetching LinkedIn Profile ID..."
            USER_INFO=$(curl -s -X GET "https://api.linkedin.com/v2/userinfo" \
              -H "Authorization: Bearer $LINKEDIN_TOKEN")
            
            PERSON_ID=$(echo "$USER_INFO" | jq -r '.sub // empty')
            
            if [ -n "$PERSON_ID" ]; then
              AUTHOR_URN="urn:li:person:$PERSON_ID"

              echo "📤 Posting to LinkedIn..."
              LI_PAYLOAD=$(jq -n \
                --arg author "$AUTHOR_URN" \
                --arg text "$POST_TEXT" \
                '{
                  author: $author,
                  lifecycleState: "PUBLISHED",
                  specificContent: {
                    "com.linkedin.ugc.ShareContent": {
                      shareCommentary: { text: $text },
                      shareMediaCategory: "NONE"
                    }
                  },
                  visibility: {
                    "com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC"
                  }
                }')

              LI_RES=$(curl -s -X POST "https://api.linkedin.com/v2/ugcPosts" \
                -H "Authorization: Bearer $LINKEDIN_TOKEN" \
                -H "Content-Type: application/json" \
                -H "X-Restli-Protocol-Version: 2.0.0" \
                -d "$LI_PAYLOAD")

              echo "LinkedIn Response: $LI_RES"
              echo "✅ Successfully posted to LinkedIn!"
            fi
          fi

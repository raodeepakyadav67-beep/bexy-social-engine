name: Auto Clinical Post to Telegram & LinkedIn

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # रोजाना सुबह 06:30 AM IST (01:00 AM UTC)

jobs:
  post-clinical-pearl:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Natural Clinical Content and Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_TOKEN: "8776734218:AAERo1LHk07laBkY-yVtVq5NBAQ6yCHHyL4"
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          TOPICS=(
            "Arterial Line Damping and Flush Test Pitfalls in ICU"
            "Noradrenaline vs Vasopressin Titration in Refractory Septic Shock"
            "Post-CABG Sudden Mediastinal Drain Cessation and Cardiac Tamponade"
            "Recognizing Patient-Ventilator Asynchrony: Double Triggering"
            "Neuro ICU: Cerebral Perfusion Pressure (CPP) vs ICP Spike Management"
            "Electrolyte Emergencies: Rapid Potassium Correction and Cardiac Arrhythmias"
            "Post-PCI Radial Artery Hematoma and Bedside Compartment Syndrome Watch"
            "Targeted Temperature Management (TTM) Post-Cardiac Arrest Pearls"
            "High PEEP Hazards: Right Ventricular Strain and Hemodynamic Collapse"
            "Bedside CVP Interpretation: Volume Responsiveness vs Fluid Overload"
          )

          RANDOM_TOPIC=${TOPICS[$RANDOM % ${#TOPICS[@]}]}

          # सीधा और कड़क प्रॉम्ट (बिना किसी नाम या रोल-प्ले कन्फ्यूजन के)
          PROMPT="Write a pure 4-line ICU bedside clinical pearl on: $RANDOM_TOPIC.
          Structure:
          - Line 1: Real-world monitor/bedside observation that books ignore.
          - Line 2: Critical titration or drug error to prevent.
          - Line 3: Immediate bedside nursing action.
          - Line 4: Golden Clinical Rule.
          Requirements:
          - Total 50-80 words only.
          - No introductions, no names, no titles, no markdown symbols (* or #), plain concise text only."

          JSON_PAYLOAD=$(jq -n --arg p "$PROMPT" '{"contents": [{"parts": [{"text": $p}]}], "generationConfig": {"temperature": 0.7, "maxOutputTokens": 400}}')

          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          POST_BODY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' | tr -d '*#"')

          if [ -z "$POST_BODY" ]; then
            echo "API Error: $RESPONSE"
            exit 1
          fi

          # पोस्ट के ऊपर आपका ऑथेंटिक हेडर और नीचे क्लिनिकल सिग्नेचर
          POST_TEXT="🩺 ICU CLINICAL PEARL: ${RANDOM_TOPIC}

${POST_BODY}

— Deepak Kumar | ICU Specialist"

          echo "Generated Short Post:"
          echo "$POST_TEXT"

          # 1. Telegram Post
          echo "Posting to Telegram..."
          curl -s -X POST "https://api.telegram.org/bot8776734218:AAERo1LHk07laBkY-yVtVq5NBAQ6yCHHyL4/sendMessage" \
            --data-urlencode "chat_id=${CHANNEL_ID}" \
            --data-urlencode "text=${POST_TEXT}"

          # 2. LinkedIn Post
          if [ -n "$LINKEDIN_TOKEN" ]; then
            echo "Fetching LinkedIn Profile..."
            USER_INFO=$(curl -s -X GET "https://api.linkedin.com/v2/userinfo" \
              -H "Authorization: Bearer ${LINKEDIN_TOKEN}")

            PERSON_ID=$(echo "$USER_INFO" | jq -r '.sub // empty')

            if [ -n "$PERSON_ID" ]; then
              AUTHOR_URN="urn:li:person:$PERSON_ID"
              LI_PAYLOAD=$(jq -n \
                --arg author "$AUTHOR_URN" \
                --arg text "$POST_TEXT" \
                '{
                  author: $author,
                  lifecycleState: "PUBLISHED",
                  specificContent: {
                    "com.linkedin.ugc.ShareContent": {
                      shareCommentary: { text: $text },
                      shareMediaCategory: "NONE"
                    }
                  },
                  visibility: {
                    "com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC"
                  }
                }')

              curl -s -X POST "https://api.linkedin.com/v2/ugcPosts" \
                -H "Authorization: Bearer ${LINKEDIN_TOKEN}" \
                -H "Content-Type: application/json" \
                -H "X-Restli-Protocol-Version: 2.0.0" \
                -d "$LI_PAYLOAD"
              echo "LinkedIn Post Sent Successfully!"
            fi
          fi

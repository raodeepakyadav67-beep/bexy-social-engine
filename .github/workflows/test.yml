name: Auto Clinical Post to Telegram & LinkedIn

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  post-clinical-pearl:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Natural Clinical Content and Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_TOKEN: "8776734218:AAERo1LHk07laBkY-yVtVq5NBAQ6yCHHyL4"
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python3 -c '
          import os, random, json, urllib.request, urllib.parse

          api_key = os.environ.get("GEMINI_API_KEY", "")
          bot_token = os.environ.get("BOT_TOKEN", "")
          channel_id = os.environ.get("CHANNEL_ID", "")
          li_token = os.environ.get("LINKEDIN_TOKEN", "")

          topics = [
              "Arterial Line Damping and Flush Test Pitfalls in ICU",
              "Noradrenaline vs Vasopressin Titration in Refractory Septic Shock",
              "Post-CABG Sudden Mediastinal Drain Cessation and Cardiac Tamponade",
              "Recognizing Patient-Ventilator Asynchrony: Double Triggering",
              "Neuro ICU: Cerebral Perfusion Pressure (CPP) vs ICP Spike Management",
              "Electrolyte Emergencies: Rapid Potassium Correction and Cardiac Arrhythmias",
              "Post-PCI Radial Artery Hematoma and Bedside Compartment Syndrome Watch",
              "Targeted Temperature Management (TTM) Post-Cardiac Arrest Pearls",
              "High PEEP Hazards: Right Ventricular Strain and Hemodynamic Collapse",
              "Bedside CVP Interpretation: Volume Responsiveness vs Fluid Overload"
          ]

          topic = random.choice(topics)

          prompt = (
              f"You are an expert ICU clinician. Write a concise, 4 to 5 lines bedside clinical pearl on: {topic}.\n"
              "Include:\n"
              "1. What the monitor actually shows vs textbook theory.\n"
              "2. The dangerous drug/titration mistake nurses must avoid.\n"
              "3. Immediate bedside troubleshooting action.\n"
              "4. Bedside Golden Rule.\n"
              "Rules: Plain text only, exactly 4-5 complete sentences, around 80-100 words. Do not truncate or cut off."
          )

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key={api_key}"
          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                  "temperature": 0.7,
                  "maxOutputTokens": 800
              }
          }

          req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req) as resp:
                  res_data = json.loads(resp.read().decode("utf-8"))
                  body = res_data["candidates"][0]["content"]["parts"][0]["text"].replace("*", "").replace("#", "").strip()
          except Exception as e:
              print(f"Gemini API Error: {e}")
              exit(1)

          full_post = f"🩺 ICU CLINICAL PEARL: {topic}\n\n{body}\n\n— Deepak Kumar | ICU Specialist"
          print("Generated Full Post:\n", full_post)

          # 1. Telegram Post
          tg_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          tg_data = urllib.parse.urlencode({"chat_id": channel_id, "text": full_post}).encode("utf-8")
          try:
              urllib.request.urlopen(urllib.request.Request(tg_url, data=tg_data))
              print("Telegram Post Sent Successfully!")
          except Exception as e:
              print(f"Telegram Error: {e}")

          # 2. LinkedIn Post
          if li_token:
              try:
                  req_user = urllib.request.Request("https://api.linkedin.com/v2/userinfo", headers={"Authorization": f"Bearer {li_token}"})
                  with urllib.request.urlopen(req_user) as r:
                      u_info = json.loads(r.read().decode("utf-8"))
                      person_id = u_info.get("sub", "")

                  if person_id:
                      author_urn = f"urn:li:person:{person_id}"
                      li_payload = {
                          "author": author_urn,
                          "lifecycleState": "PUBLISHED",
                          "specificContent": {
                              "com.linkedin.ugc.ShareContent": {
                                  "shareCommentary": {"text": full_post},
                                  "shareMediaCategory": "NONE"
                              }
                          },
                          "visibility": {"com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC"}
                      }
                      li_req = urllib.request.Request(
                          "https://api.linkedin.com/v2/ugcPosts",
                          data=json.dumps(li_payload).encode("utf-8"),
                          headers={
                              "Authorization": f"Bearer {li_token}",
                              "Content-Type": "application/json",
                              "X-Restli-Protocol-Version: 2.0.0"
                          }
                      )
                      urllib.request.urlopen(li_req)
                      print("LinkedIn Post Sent Successfully!")
              except Exception as e:
                  print(f"LinkedIn Error: {e}")
          '

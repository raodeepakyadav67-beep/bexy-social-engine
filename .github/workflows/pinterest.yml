name: Auto Clinical Pin to Pinterest

on:
  workflow_dispatch:

jobs:
  get-board-id:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Pinterest Boards
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          echo "🔍 Fetching User Info..."
          curl -s -X GET "https://api.pinterest.com/v5/user_account" \
            -H "Authorization: Bearer $PINTEREST_TOKEN"
          echo -e "\n----------------------------------------\n"
          
          echo "🔍 Fetching Boards..."
          curl -s -X GET "https://api.pinterest.com/v5/boards?page_size=20" \
            -H "Authorization: Bearer $PINTEREST_TOKEN"

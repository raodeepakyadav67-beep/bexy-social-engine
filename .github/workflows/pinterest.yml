name: Auto Clinical Pin to Pinterest

on:
  workflow_dispatch:

jobs:
  get-board-id:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Pinterest Boards (Sandbox & Trial Check)
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          echo "🔍 Testing Sandbox Endpoint..."
          curl -s -X GET "https://api-sandbox.pinterest.com/v5/user_account" \
            -H "Authorization: Bearer $PINTEREST_TOKEN"
          echo -e "\n----------------------------------------\n"
          
          echo "🔍 Testing Sandbox Boards..."
          curl -s -X GET "https://api-sandbox.pinterest.com/v5/boards" \
            -H "Authorization: Bearer $PINTEREST_TOKEN"

name: Generate Final Tumblr Tokens

on:
  workflow_dispatch:

jobs:
  get_final_tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install requests_oauthlib

      - name: Fetch Final Access Token
        env:
          CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
        run: |
          python - << 'EOF'
          import os
          from requests_oauthlib import OAuth1Session

          ck = os.environ['CONSUMER_KEY'].strip()
          cs = os.environ['CONSUMER_SECRET'].strip()
          
          # पहले स्टेप से मिले टोकन और सीक्रेट
          resource_owner_key = "Zq2K88sC4UQiAcAC3IEdpBlPscgyzblI28zFM2Em4JBz5ddc5I"
          resource_owner_secret = "HF8w5gdt1XjpMvW5UDCwGmVRWeTLmRG7vxEDUK26GlZXQ1YwJn"
          verifier = "dt5ovvTV4UqAnWSUy2aqTHfO5fJuCVzfPScrNlk3DC6pRpqAhU"

          oauth = OAuth1Session(
              ck,
              client_secret=cs,
              resource_owner_key=resource_owner_key,
              resource_owner_secret=resource_owner_secret,
              verifier=verifier
          )

          tokens = oauth.fetch_access_token('https://www.tumblr.com/oauth/access_token')

          print("=" * 60)
          print("🎉 आपके फ़ाइनल Tumblr Tokens:")
          print(f"TUMBLR_OAUTH_TOKEN={tokens.get('oauth_token')}")
          print(f"TUMBLR_OAUTH_TOKEN_SECRET={tokens.get('oauth_token_secret')}")
          print("=" * 60)
          EOF

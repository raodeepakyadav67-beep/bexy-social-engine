name: Generate Tumblr Keys

on:
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytumblr
        run: pip install pytumblr

      - name: Check Direct Client
        run: |
          python - << 'EOF'
          import pytumblr

          # डायरेक्ट क्रेडेंशियल्स टेस्ट
          c_key = "JlignQZnFRCvqGyZQ6TGHmC7Z9bE19JVESSAZdEvKkrc39P2Th"
          c_sec = "kWBs9rVOe3hfQe3p8vZYYTmxKNN5byUbxiog9lYSVh3GxMXr"
          o_tok = "ksHxpy4LpeMyMuN640nxDrDfErAb8IpJ0K9SW0SIeL47hkSDyK"
          o_sec = "MPUo30BMfMnDuSt9OmfTDjkeNabl2EGLI4aGJxmbjAZKLf7Nqf"

          client = pytumblr.TumblrRestClient(c_key, c_sec, o_tok, o_sec)
          res = client.info()
          print("DIRECT INFO RESULT:", res)
          EOF

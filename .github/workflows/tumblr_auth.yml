name: Test Post to Bexyhub Tumblr

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytumblr
        run: pip install pytumblr

      - name: Create Test Post
        env:
          CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import pytumblr

          client = pytumblr.TumblrRestClient(
              os.environ['CONSUMER_KEY'],
              os.environ['CONSUMER_SECRET'],
              os.environ['OAUTH_TOKEN'],
              os.environ['OAUTH_SECRET']
          )

          # Bexyhub ब्लॉग पर टेस्ट पोस्ट
          response = client.create_text(
              'bexyhub',
              title='Clinical Automation Engine Online',
              body='Deepak Bexy clinical auto-post engine is successfully connected and verified via GitHub Actions.'
          )
          print("Response:", response)
          EOF

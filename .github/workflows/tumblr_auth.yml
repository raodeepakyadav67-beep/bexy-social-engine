name: Publish Verified Post via OAuth2

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Create Tumblr Post
        run: |
          python - << 'EOF'
          import requests

          access_token = "aUCQ6BqiOrfODgDU6XE3n1opRn38CqFLcNsTFUCbAbgTRpVy0q"

          headers = {
              "Authorization": f"Bearer {access_token}",
              "Content-Type": "application/json"
          }

          post_url = "https://api.tumblr.com/v2/blog/bexyhub/post"

          payload = {
              "content": [
                  {
                      "type": "text",
                      "text": "Clinical Automation Verified & Live!\n\nDeepak Bexy automated posting pipeline via GitHub Actions is now officially active and operational."
                  }
              ]
          }

          res = requests.post(post_url, headers=headers, json=payload)
          print("POST STATUS CODE:", res.status_code)
          print("RESPONSE JSON:", res.json())
          EOF

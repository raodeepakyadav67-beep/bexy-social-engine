name: Post Clinical Notes to Tumblr

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 4 * * *' # रोज़ सुबह 11:30 AM IST पर ऑटोमैटिक पोस्ट के लिए

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pytumblr requests

      - name: Publish Post to Tumblr
        env:
          CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import pytumblr

          client = pytumblr.TumblrRestClient(
              os.environ['CONSUMER_KEY'].strip(),
              os.environ['CONSUMER_SECRET'].strip(),
              os.environ['OAUTH_TOKEN'].strip(),
              os.environ['OAUTH_SECRET'].strip()
          )

          user_info = client.info()
          blog_name = user_info['user']['blogs'][0]['name']

          title = "Clinical Note: Hemodynamic Assessment & Vasopressor Management"
          body = """
          <p><strong>Clinical Focus:</strong> Practical Bedside Vasopressor Titration & Real-World Pearls.</p>
          <hr>
          <p>Key takeaways from the intensive care unit floor:</p>
          <ul>
            <li><strong>MAP Target:</strong> Maintain Mean Arterial Pressure &ge; 65 mmHg in septic shock prior to considering second-line agents.</li>
            <li><strong>Line Safety:</strong> Central access preferred; peripheral infusion requires close extravasation surveillance.</li>
            <li><strong>Bedside Rationale:</strong> Titrate to organ perfusion indicators (lactate clearance, urine output, cap refill) rather than numerical targets alone.</li>
          </ul>
          <p><em>Published via Bexyhub Clinical Engine.</em></p>
          """
          tags = ["clinical nursing", "critical care", "ICU", "bexyhub", "medical pearls"]

          response = client.create_text(blog_name, state="published", title=title, body=body, tags=tags)
          print(f"Posted successfully to {blog_name}: {response}")
          EOF

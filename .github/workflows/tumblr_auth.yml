name: Publish Verified Post

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytumblr
        run: pip install pytumblr

      - name: Create Post Direct
        run: |
          python - << 'EOF'
          import pytumblr

          # असली व सत्यापित क्रेडेंशियल्स
          client = pytumblr.TumblrRestClient(
              "k8zSXcYOmw1R0KV6lDmfeYLpPoZQ1mtrWKoLD5ZkKQLCqAutkp",
              "3vhWHCiPtgyfpBmjT33jsKQjg2dKYONlkRPmHIOOOVEhvjRZzQ",
              "gFoIAYkIyraYCFnx7x2chsckjoOAhI7vl2sCByXE61o0j4duWy",
              "jbpn0q6aUKn5QJ8o6Undl9WQT3QhBBh2Q60qFrzlHE3LOhomkP"
          )

          # bexyhub पर सीधा पोस्ट
          res = client.create_text(
              'bexyhub',
              title='Clinical Automation Engine Live',
              body='Deepak Bexy automated pipeline via GitHub Actions is officially verified and operational.'
          )
          print("DIRECT POST RESPONSE:", res)
          EOF

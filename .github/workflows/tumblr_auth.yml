name: Get Tumblr Access Token

on:
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install requests_oauthlib

      - name: Get OAuth Tokens
        env:
          CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
        run: |
          python - << 'EOF'
          import os
          from requests_oauthlib import OAuth1Session

          ck = os.environ['CONSUMER_KEY']
          cs = os.environ['CONSUMER_SECRET']

          oauth = OAuth1Session(ck, client_secret=cs)
          fetch_response = oauth.fetch_request_token('https://www.tumblr.com/oauth/request_token')
          
          resource_owner_key = fetch_response.get('oauth_token')
          resource_owner_secret = fetch_response.get('oauth_token_secret')
          
          authorization_url = oauth.authorization_url('https://www.tumblr.com/oauth/authorize')
          
          print("=" * 60)
          print("🔗 कृपया इस लिंक को ब्राउज़र में खोलकर Authorize करें:")
          print(authorization_url)
          print("=" * 60)
          print(f"TEMP_KEY={resource_owner_key}")
          print(f"TEMP_SECRET={resource_owner_secret}")
          EOF

name: Test Direct Tumblr Post

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytumblr
        run: pip install pytumblr

      - name: Create Test Post
        run: |
          python - << 'EOF'
          import pytumblr

          # Bexyhub Auto की स्थायी कुंजियाँ
          CONSUMER_KEY = "k8zSXcYOmw1R0KV6lDmfeYLpPoZQ1mtrWKoLD5ZkKQLCqAutkp"
          CONSUMER_SECRET = "3vhWHCiPtgyfpBmjT33jsKQjg2dKYONlkRPmHIOOOVEhvjRZzQ"
          OAUTH_TOKEN = "Z70SrHgIm6QPgzxbBueSoA1eGusYExOj2PC3jKElaFkyoYb4mw"
          OAUTH_SECRET = "SwCSGWXRNWclVUBt8JSW1QMog0OQ6BI1E1swy5hTzyg4Rgq7wU"

          client = pytumblr.TumblrRestClient(
              CONSUMER_KEY,
              CONSUMER_SECRET,
              OAUTH_TOKEN,
              OAUTH_SECRET
          )

          # पहले यूज़र और ब्लॉग की जानकारी निकालें
          info = client.info()
          print("USER INFO:", info)

          # पहले उपलब्ध ब्लॉग पर पोस्ट करें
          blogs = info.get('user', {}).get('blogs', [])
          if blogs:
              blog_name = blogs[0]['name']
              print("TARGET BLOG:", blog_name)
              res = client.create_text(
                  blog_name,
                  title="Clinical Automation Verified",
                  body="Tumblr API connection is fully verified and active via GitHub Actions."
              )
              print("POST RESPONSE:", res)
          else:
              print("No blog found for this account!")
          EOF

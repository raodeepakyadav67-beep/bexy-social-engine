name: Publish Verified Post via OAuth2

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Create Tumblr Post
        run: |
          python - << 'EOF'
          import requests

          access_token = "aUCQ6BqiOrfODgDU6XE3n1opRn38CqFLcNsTFUCbAbgTRpVy0q"

          headers = {
              "Authorization": f"Bearer {access_token}"
          }

          # Standard Legacy Post Endpoint (Most Reliable)
          post_url = "https://api.tumblr.com/v2/blog/bexyhub/post"

          data = {
              "type": "text",
              "title": "Clinical Automation Engine Live",
              "body": "<p>Deepak Bexy automated pipeline via GitHub Actions is now officially active and operational.</p>",
              "tags": "clinical,nursing,education,bexyhub"
          }

          res = requests.post(post_url, headers=headers, data=data)
          print("POST STATUS CODE:", res.status_code)
          print("RESPONSE JSON:", res.json())
          EOF

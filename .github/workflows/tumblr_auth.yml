name: Generate Tumblr Access Token

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Type "start" to get link, or "finish" with verifier'
        required: true
        default: 'start'
      oauth_token:
        description: 'Resource Owner Key (from start step)'
        required: false
      oauth_secret:
        description: 'Resource Owner Secret (from start step)'
        required: false
      verifier:
        description: 'Verifier code from URL'
        required: false

jobs:
  oauth:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install requests_oauthlib

      - name: Process OAuth
        env:
          CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          ACTION_TYPE: ${{ github.event.inputs.action_type }}
          REQ_KEY: ${{ github.event.inputs.oauth_token }}
          REQ_SECRET: ${{ github.event.inputs.oauth_secret }}
          VERIFIER: ${{ github.event.inputs.verifier }}
        run: |
          python - << 'EOF'
          import os
          from requests_oauthlib import OAuth1Session

          ck = os.environ['CONSUMER_KEY'].strip()
          cs = os.environ['CONSUMER_SECRET'].strip()
          action = os.environ['ACTION_TYPE'].strip()

          if action == 'start':
              oauth = OAuth1Session(ck, client_secret=cs)
              fetch_response = oauth.fetch_request_token('https://www.tumblr.com/oauth/request_token')
              token = fetch_response.get('oauth_token')
              secret = fetch_response.get('oauth_token_secret')
              url = oauth.authorization_url('https://www.tumblr.com/oauth/authorize')
              print("=" * 60)
              print(f"LINK: {url}")
              print(f"KEY: {token}")
              print(f"SECRET: {secret}")
              print("=" * 60)
          elif action == 'finish':
              req_key = os.environ['REQ_KEY'].strip()
              req_sec = os.environ['REQ_SECRET'].strip()
              verifier = os.environ['VERIFIER'].strip()
              
              oauth = OAuth1Session(
                  ck,
                  client_secret=cs,
                  resource_owner_key=req_key,
                  resource_owner_secret=req_sec,
                  verifier=verifier
              )
              tokens = oauth.fetch_access_token('https://www.tumblr.com/oauth/access_token')
              print("=" * 60)
              print("🎉 FINAL TOKENS:")
              print(f"TUMBLR_OAUTH_TOKEN: {tokens.get('oauth_token')}")
              print(f"TUMBLR_OAUTH_TOKEN_SECRET: {tokens.get('oauth_token_secret')}")
              print("=" * 60)
          EOF

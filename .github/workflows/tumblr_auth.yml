name: Get Real Tumblr Token

on:
  workflow_dispatch:

jobs:
  get_token:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests_oauthlib

      - name: Generate Auth URL
        run: |
          python - << 'EOF'
          from requests_oauthlib import OAuth1Session

          CONSUMER_KEY = "JlignQZnFRCvqGyZQ6TGHmC7Z9bE19JVESSAZdEvKkrc39P2Th"
          CONSUMER_SECRET = "kWBs9rVOe3hfQe3p8vZYYTmxKNN5byUbxiog9lYSVh3GxMXr"
          CALLBACK_URI = "http://localhost:8080/callback"

          oauth = OAuth1Session(CONSUMER_KEY, client_secret=CONSUMER_SECRET, callback_uri=CALLBACK_URI)
          fetch_response = oauth.fetch_request_token("https://www.tumblr.com/oauth/request_token")
          
          resource_owner_key = fetch_response.get('oauth_token')
          resource_owner_secret = fetch_response.get('oauth_token_secret')

          print("\n" + "="*50)
          print("STEP 1: OPEN THIS LINK IN YOUR BROWSER:")
          authorization_url = oauth.authorization_url("https://www.tumblr.com/oauth/authorize")
          print(authorization_url)
          print("="*50 + "\n")
          EOF

name: Generate Tumblr Keys Direct

on:
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytumblr
        run: pip install pytumblr requests_oauthlib

      - name: Obtain Real Tokens
        run: |
          python - << 'EOF'
          import urllib.parse
          from requests_oauthlib import OAuth1Session

          # Bexyhub Auto की कुंजियाँ
          CONSUMER_KEY = "kBzSXcYOmw1ROKV6lDmfeYLPPoZQimtrWKoLD5ZkKQLCqAutkp"
          CONSUMER_SECRET = "3vhWHCIPtgyfpBmjT33jskQjg2dKYONlkRPMHIOOOVEhvJRZzQ"

          oauth = OAuth1Session(CONSUMER_KEY, client_secret=CONSUMER_SECRET)
          try:
              fetch_response = oauth.fetch_request_token("https://www.tumblr.com/oauth/request_token")
              owner_key = fetch_response.get('oauth_token')
              owner_secret = fetch_response.get('oauth_token_secret')

              auth_url = oauth.authorization_url("https://www.tumblr.com/oauth/authorize")
              print("\n" + "="*60)
              print("IS URL KO BROWSER ME KHOL KAR ALLOW DABAYEIN:")
              print(auth_url)
              print("="*60 + "\n")
              print("TEMP_SECRET:", owner_secret)
          except Exception as e:

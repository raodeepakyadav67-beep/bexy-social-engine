name: Post Clinical Update to Tumblr

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytumblr
        run: pip install pytumblr

      - name: Publish Post
        env:
          CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import pytumblr

          client = pytumblr.TumblrRestClient(
              os.environ['CONSUMER_KEY'],
              os.environ['CONSUMER_SECRET'],
              os.environ['OAUTH_TOKEN'],
              os.environ['OAUTH_SECRET']
          )

          # bexyhub ब्लॉग पर ऑटोमैटिक पोस्ट
          res = client.create_text(
              'bexyhub',
              title='Clinical Post Engine Live',
              body='Deepak Bexy automated posting pipeline via GitHub Actions is now active and verified.'
          )
          print("POST STATUS:", res)
          EOF
